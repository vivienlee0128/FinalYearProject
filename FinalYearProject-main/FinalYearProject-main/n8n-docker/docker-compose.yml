version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Kuala_Lumpur # Replace with your local timezone
      - TZ=Asia/Kuala_Lumpur
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data: