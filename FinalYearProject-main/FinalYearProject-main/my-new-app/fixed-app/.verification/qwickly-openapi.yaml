    patch:
      operationId: Course_Partial_Update
      description: |-
        Update only the provided fields. You can patch base fields (name, code, sis_id, semester, instructors, large_course_enrollment) and nested sections (settings, location, nfc_data).

        Semester field: On input (PATCH), the "semester" field accepts either the semester NAME or the semester CODE. Responses will always return the semester NAME.

        Within settings, you may patch: student_grouping, grading (session_based_grading + absence_based_grading), check_in, absence_limits, enable_location_confirmation_course, enable_nfc_tag_confirmation_course.

        Note: course_enrollments is read-only. It cannot be edited via PATCH/PUT/POST. Requests including this key will be rejected with a 400 error.

        Note: The read-only flags returned in GET responses — is_limit_readonly, is_label_readonly, is_email_template_readonly — cannot be patched. Requests including these keys under settings.absence_limits will be rejected with a 400 error.
      summary: Partial update course
      parameters:
