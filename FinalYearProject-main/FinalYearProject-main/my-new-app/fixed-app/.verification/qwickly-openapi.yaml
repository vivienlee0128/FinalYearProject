      properties:
        on_conflict:
          $ref: '#/components/schemas/UserBulkCreateRequestOnConflictEnum'
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserCreateRequest'
      required:
      - items
    UserBulkCreateRequestOnConflictEnum:
      enum:
      - error
      - ignore
      - update
      type: string
      description: |-
        * `error` - error
        * `ignore` - ignore
        * `update` - update
    UserBulkCreateResultItem:
      type: object
      description: |-
        Represents one result item in the 207 response for bulk POST /user/.
        Mirrors the runtime structure built in views_user.UserListCreateUpdate.create().
      properties:
        index:
          type: integer
          description: Index of the item in request.items (0-based).
        status:
          type: integer
        id:
          type: integer
        detail:
          type: string
          nullable: true
        updated_fields:
          type: array
          items:
