        '204':
          description: Deleted successfully
  /api/dashboard/v1/course/{course_identifier}/session/:
    get:
      operationId: Course_Sessions_List
      description: |-
        List sessions under a course with optional filtering and pagination.

        Query parameter details:
        - search: Free-text across id and title. Examples: search=Week, search=105.
        - created_at: Creation date of the session in YYYY-MM-DD (UTC) format. Example: created_at=2025-10-01.
        - start_after: Filter sessions starting on or after this date (YYYY-MM-DD). Example: start_after=2025-10-01.
        - start_before: Filter sessions starting on or before this date (YYYY-MM-DD). Example: start_before=2025-10-15.
        - is_pre_created: Boolean (true|false). true returns only planned/scheduled sessions, false returns only sessions not marked as pre-created.
        - using_location_context: Boolean (true|false). Filter sessions that used Location Context. Example: using_location_context=true.
        - using_location_confirmation: Boolean (true|false). Filters sessions that required/used location confirmation.
        - using_nfc: Boolean (true|false). Filter sessions that used NFC tag confirmation. Example: using_nfc=false.
        - method: String; filters by the session method (case-insensitive exact match). Common values include: "manual", "check-in", "card-reader", "qr", "nfc", "kiosk", "import", "pre-created".
        - page, page_size: Standard pagination controls.
      summary: List sessions for a course
      parameters:
      - in: path
        name: course_identifier
        schema:
          type: string
        description: 'One of: id:{pk} | lms_id:{value} | sis_id:{value} | code:{value}
          — or simply {pk} (defaults to id)'
        required: true
      - in: query
        name: created_at
        schema:
          type: string
          format: date
        description: 'Creation date (YYYY-MM-DD). Example: created_at=2025-10-01'
      - in: query
        name: is_pre_created
        schema:
          type: boolean
        description: 'Boolean flag (true|false). Example: is_pre_created=true'
      - in: query
        name: method
        schema:
          type: string
        description: 'String; case-insensitive. Common values: manual, check-in, card-reader,
          qr, nfc, kiosk, import, pre-created. Example: method=manual'
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page index
      - in: query
        name: page_size
        schema:
          type: integer
        description: Items per page
      - in: query
        name: search
        schema:
          type: string
        description: 'Free-text across id and title. Examples: search=Week 1, search=1002'
      - in: query
        name: start_after
        schema:
          type: string
          format: date
        description: 'Filter sessions starting on or after this date (YYYY-MM-DD).
          Example: start_after=2025-10-01'
      - in: query
        name: start_before
        schema:
          type: string
          format: date
        description: 'Filter sessions starting on or before this date (YYYY-MM-DD).
          Example: start_before=2025-10-15'
      - in: query
        name: using_location_confirmation
        schema:
          type: boolean
        description: 'Boolean flag (true|false). Example: using_location_confirmation=false'
      - in: query
        name: using_location_context
        schema:
          type: boolean
        description: 'Boolean flag (true|false). Example: using_location_context=true'
      - in: query
        name: using_nfc
        schema:
          type: boolean
        description: 'Boolean flag (true|false). Example: using_nfc=false'
      tags:
      - Session
      security:
      - oauth2:
        - course:write
      - oauth2:
        - course:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSessionList'
          description: Paginated list of sessions
    post:
      operationId: Course_Sessions_Create
      description: |-
        Create sessions under a course. Send a single session object or bulk with {"items": [...], "on_conflict": "ignore|update"}.

        Required fields (POST create):
        - Single object: title, start_time are required.
        - Bulk: each item in items[] must include title and start_time.

        Notes:
        - On creation, the API will set method to "Pre-created" and is_pre_created to true by default.
        - Bulk POST response uses per-item status: created | updated | ignored | failed. With on_conflict=ignore, duplicates are returned as ignored; with on_conflict=update, duplicates are returned as updated.
      summary: Create sessions (single or bulk)
      parameters:
      - in: path
        name: course_identifier
        schema:
          type: string
        required: true
      tags:
      - Session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
            examples:
              SingleCreate:
                value:
                  title: Week 7 Lecture
                  start_time: '2025-10-15T10:00:00-04:00'
                summary: Single create
              BulkCreate:
                value:
                  on_conflict: update
                  items:
                  - title: Week 7 Lecture
                    start_time: '2025-10-15T10:00:00-04:00'
                  - title: Lab 7
                    start_time: '2025-10-17T10:00:00-04:00'
                summary: Bulk create
        required: true
      security:
      - oauth2:
        - course:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                SingleCreate—201Response:
                  value:
                    id: 1050
                    title: Week 7 Lecture
                    start_time: '2025-10-15T10:00:00-04:00'
                    method: Pre-created
                    started_by: null
                    is_pre_created: true
                    using_location_context: false
                    using_location_confirmation: true
                    using_nfc: false
                    group_id: null
                    section_id: null
                    created_at: '2025-09-30T09:15:00Z'
                    edited_at: '2025-09-30T09:15:00Z'
                  summary: Single create — 201 response
                  description: Successful single session creation returns the created
                    session object.
                BulkCreate—207Response:
                  value:
                    results:
                    - id: 1050
                      status: created
                    - id: 1051
                      status: updated
                    - status: ignored
                      detail: 'Existing session matched and left unchanged (conflict
                        policy: ignore)'
                    - status: failed
                      detail: Validation error message here
                  summary: Bulk create — 207 response
                  description: Bulk creation returns per-item statuses with ids.
          description: Created
        '207':
          description: Multi-Status (bulk results)
    put:
      operationId: Course_Sessions_Bulk_Update
      description: |-
        Bulk update sessions for a course. Creation is not allowed on PUT. Each item must include id, title, and start_time.

        Rules:
        - id: The session id to update. If a session is not found under the course, the item is reported as failed and nothing is created.
        - title and start_time: Mandatory on PUT for every item — items missing these fields are rejected.
      summary: Update sessions (bulk, update-only)
      parameters:
      - in: path
        name: course_identifier
        schema:
          type: string
        required: true
      tags:
      - Session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionBulkPutRequest'
            examples:
              BulkUpdate(allItemsRequireId,Title,StartTime):
                value:
                  items:
                  - id: 1001
                    title: Week 5 Lecture
                    start_time: '2025-10-01T10:00:00-04:00'
                  - id: 1002
                    title: Week 6 Lecture
                    start_time: '2025-10-08T10:00:00-04:00'
                summary: Bulk update (all items require id, title, start_time)
        required: true
      security:
      - oauth2:
        - course:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
              examples:
                BulkUpdate—200Response:
                  value:
                    results:
                    - id: 1001
                      status: updated
                    - status: failed
                      detail: Session not found
                  summary: Bulk update — 200 response
                  description: Each item returns its id and status. PUT never creates;
                    items not found are reported as failed.
          description: Results
    patch:
      operationId: Course_Sessions_Bulk_Patch
      description: |-
        Partially update multiple sessions in one call.

        Rules:
        - id: Mandatory for every item; identifies the session to update under the course.
        - Other fields are optional and only those provided will be updated. Allowed fields: title, start_time.
      summary: Partial update sessions (bulk)
      parameters:
      - in: path
        name: course_identifier
        schema:
          type: string
        required: true
      tags:
      - Session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSessionBulkPatchRequest'
            examples:
              BulkPartialUpdate(idRequiredForEachItem):
                value:
                  items:
                  - id: 1001
                    title: Week 5 Lecture (Updated)
                  - id: 1002
                    start_time: '2025-10-08T11:00:00Z'
                summary: Bulk partial update (id required for each item)
      security:
      - oauth2:
        - course:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
              examples:
                BulkPartialUpdate—200Response:
                  value:
                    results:
                    - id: 1001
                      status: updated
                    - status: failed
                      detail: Session not found
                  summary: Bulk partial update — 200 response
                  description: Each item returns id and update status.
          description: Results
