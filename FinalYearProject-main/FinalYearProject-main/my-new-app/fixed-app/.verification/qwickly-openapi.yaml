  /api/dashboard/v1/user/:
    get:
      operationId: Users_List
      description: |-
        Return users scoped to the current instance in the base user shape.

        Filtering and search notes:
        - search: free-text across first/last/username/email/company/role, custom_associated_id, sis_id, lms_id.
        - first_name/last_name/username: exact match filters.
        - pii_opt_out: presence filter — true = not null, false = null.
        Pagination via page and page_size.
      summary: List Users
      parameters:
      - in: query
        name: first_name
        schema:
          type: string
        description: 'Exact match on first_name. Example: first_name=Ada'
      - in: query
        name: last_name
        schema:
          type: string
        description: 'Exact match on last_name. Example: last_name=Lovelace'
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page index
      - in: query
        name: page_size
        schema:
          type: integer
        description: Number of results per page
      - in: query
        name: pii_opt_out
        schema:
          type: string
        description: 'Presence flag: true = pii_opt_out IS NOT NULL; false = pii_opt_out
          IS NULL'
      - in: query
        name: search
        schema:
          type: string
        description: 'Free-text search across common user fields (names, username,
          email, company, role, custom_associated_id, sis_id, lms_id). Examples: search=ada,
          search=LMS-1001'
      - in: query
        name: username
        schema:
          type: string
        description: 'Exact match on username. Example: username=alovelace'
      tags:
      - Users
      security:
      - oauth2:
        - user:read
        - user:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserBaseList'
          description: Paginated list of users in base shape
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: Too Many Requests
    post:
      operationId: Users_Create
      description: |-
        Create one or many users in a single request.

        Request options:
        - Single: send a single user object (base shape).
        - Bulk: send an object with items: [user_object_1, user_object_2 ...].
        - on_conflict (optional): error | ignore | update — applies to bulk only.

        Identifier & constraints:
        - lms_id is required on create.
        - Other fields are optional.

        Behavior by on_conflict:
        - error (default): duplicate lms_id within your instance → per-item 409.
        - ignore: duplicate → per-item 200 with detail="ignored (exists)".
        - update: duplicate → per-item 200 and updates only provided, non-identifier fields.
      summary: Create Users (single or bulk)
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
            examples:
              SingleCreate:
                value:
                  first_name: Grace
                  last_name: Hopper
                  username: ghopper
                  role: instructor
                  email: grace@uni.edu
                  lms_id: LMS-7001
                summary: Create One User
              BulkCreateWithOnConflict:
                value:
                  on_conflict: update
                  items:
                  - first_name: Ada
                    last_name: Lovelace
                    lms_id: LMS-9001
                  - first_name: Alan
                    last_name: Turing
                    lms_id: LMS-9002
                  - email: ada-new@uni.edu
                    lms_id: LMS-9001
                summary: Create Multiple Users
          application/vnd.qwickly.bulk+json:
            schema:
              $ref: '#/components/schemas/UserBulkCreateRequest'
        required: true
      security:
      - oauth2:
        - user:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBase'
              examples:
                201Created—SingleUser:
                  value:
                    id: 101
                    first_name: Grace
                    last_name: Hopper
                    username: ghopper
                    other_name: null
                    role: instructor
                    email: grace@uni.edu
                    company: Uni
                    phone_number: '+15551234567'
                    custom_associated_id: CUST-01
                    sis_id: SIS-001
                    lms_id: LMS-7001
                    pii_opt_out: null
                    date_last_synced: null
                  summary: Successful single create response
                  description: Response body returned when a single user is created
                    successfully.
          description: Created (single item). Returned body is the user in base shape.
        '207':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBulkCreateMultiStatusResponse'
              examples:
                207Multi-Status—BulkCreate:
                  value:
                    results:
                    - index: 0
                      status: 201
                      id: 201
                      detail: created
                    - index: 1
                      status: 201
                      id: 202
                      detail: created
                    - index: 2
                      status: 409
                      detail: duplicate
                  summary: Bulk create per-item results
                  description: Response body returned when using bulk create. Each
                    item includes index, status, id and optional detail/updated_fields.
          description: 'Multi-Status (bulk). Returned body shape: {"results": [{"index":
            int, "status": int, "id": int, "detail": str, "updated_fields"?: [str,
            ...]}]}'
    patch:
      operationId: dashboard_v1_user_partial_update
      description: |-
        Patch multiple users at once in a single transaction. Each list item must include
        user: { user_identifier: 'id|lms_id|sis_id|custom_associated_id', value: '...' } along with fields to update.

        Notes:
        - Only provided fields are updated; others remain unchanged.
        - Response is 207 Multi-Status with per-item results and updated_fields.
      summary: Bulk Partial Update
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserBulkPatchItem'
            examples:
              BulkPatch:
                value:
                - user:
                    user_identifier: lms_id
                    value: LMS-9001
                  role: instructor
                  company: Uni
                - user:
                    user_identifier: sis_id
                    value: SIS-002
                  first_name: Alan
                  last_name: Turing
                  username: aturing
                summary: Bulk patch
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserBulkPatchItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserBulkPatchItem'
      security:
      - oauth2:
        - user:write
      responses:
        '207':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBulkPatchMultiStatusResponse'
              examples:
                207Multi-Status—BulkPatch:
                  value:
                    results:
                    - user:
                        user_identifier: lms_id
                        value: LMS-9001
                      status: 200
                      detail: updated
                      updated_fields:
                      - role
                      - company
                    - user:
                        user_identifier: sis_id
                        value: SIS-002
                      status: 404
                      detail: User not found.
                  summary: Per-item results for bulk patch
                  description: Each item includes the user identification object,
                    status, optional detail, and updated_fields when applicable.
          description: 'Multi-Status (bulk). Returned body shape: {"results": [{"user":
            {"user_identifier": str, "value": str|int}, "status": int, "detail": str,
            "updated_fields"?: [str, ...]}]}'
