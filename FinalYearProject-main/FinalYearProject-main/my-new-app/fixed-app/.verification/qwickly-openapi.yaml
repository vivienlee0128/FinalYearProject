openapi: 3.0.3
info:
  title: Qwickly API
  version: 1.0.0
  description: API for Qwickly
paths:
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: Obtain OAuth 2.0 bearer token.
      summary: Generate Auth Token
      tags:
      - Auth 2.0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCredentialsTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientCredentialsTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientCredentialsTokenRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/dashboard/v1/course/:
    get:
      operationId: Courses_List
      description: List courses for the current instance with optional search, filters,
        and includes. By default returns the base course fields. Use include[] to
        expand nested sections.
      summary: List courses
      parameters:
      - in: query
        name: has_location_confirmation
        schema:
          type: boolean
        description: true|false (derived from settings)
      - in: query
        name: has_nfc_confirmation
        schema:
          type: boolean
        description: true|false (derived from settings)
      - in: query
        name: include[]
        schema:
          type: array
          items:
            type: string
        description: 'Repeated. Allowed: course_statistics, settings, location, nfc_data,
          course_enrollments. Note: location and nfc_data are legacy; rooms should
          be used instead. Note: course_enrollments requires the user:read or user:write
          scope.'
      - in: query
        name: instructor_id
        schema:
          type: integer
        description: Filter by instructor id
      - in: query
        name: large_course_enrollment
        schema:
          type: boolean
        description: true|false
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Free text search across several fields
      - in: query
        name: semester
        schema:
          type: string
        description: Exact semester name or code (e.g., 2025-Fall)
      tags:
      - Course
      security:
      - oauth2:
        - course:read
        - course:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseList'
          description: Paginated list of courses
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: Too Many Requests
    post:
      operationId: Courses_Create
      description: |-
        Create courses. You can send a single course object, or bulk create using {"items": [...], "on_conflict": "ignore|update"}.
        Request must include lms_id.

        Request may include nested settings, location, and nfc_data.

        Semester field: On input (POST), the "semester" field accepts either the semester NAME or the semester CODE.
        Responses will always return the semester NAME.

        Note: course_enrollments is read-only. It cannot be created or edited via this API. Requests including course_enrollments will be rejected with a 400 error.
      summary: Create courses (single or bulk)
      tags:
      - Course
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseBulkCreateRequest'
            examples:
              SingleCreate:
                value:
                  lms_id: '98765'
                  name: Intro to Algorithms
                  code: CSCI-200
                  sis_id: SIS-4455
                  semester: 2025-Fall
                  instructors:
                  - user_identifier: id
                    value: '123'
                  room_ids:
                  - 1
                  - 2
                  large_course_enrollment: true
                  settings:
                    student_grouping: single
                    grading:
                      session_based_grading:
                        grading_method: points_per_session
                        column_name: Attendance
                        points: 1
                      absence_based_grading:
                        column_name: Absences
                        total_points: 20
                        points_per_absence: -1
                        forgive_absences: 2
                        forgive_absences_method: exclude
                    check_in:
                      check_in_pin_requirement: false
                      check_in_qr_mode: false
                      check_in_timer: 0
                    absence_limits:
                    - limit: 1
                      label: Warning
                      email_template: Keep attending!
                    enable_location_confirmation_course: true
                    enable_nfc_tag_confirmation_course: false
                  location:
                    room_name: ET 101
                    latitude: 39.7684
                    longitude: -86.1581
                    radius: 25
                  nfc_data:
                    nfc: tag-ABC123
                summary: Single create
              BulkCreate(withConflictPolicy):
                value:
                  on_conflict: update
                  items:
                  - lms_id: '98765'
                    name: Intro to Algorithms
                    code: CSCI-200
                    sis_id: SIS-4455
                    semester: 2025-Fall
                    instructors:
                    - user_identifier: id
                      value: '123'
                    large_course_enrollment: true
                  - lms_id: '54321'
                    name: Data Structures
                    code: CSCI-250
                    sis_id: SIS-7788
                    semester: 2025-Fall
                    instructors:
                    - user_identifier: id
                      value: '124'
                    large_course_enrollment: false
                summary: Bulk create (with conflict policy)
        required: true
      security:
      - oauth2:
        - course:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
              examples:
                201Created—SingleCourse:
                  value:
                    id: 123
                    lms_id: '98765'
                    name: Intro to Algorithms
                    code: CSCI-200
                    sis_id: SIS-4455
                    semester: 2025-Fall
                    instructors:
                    - id: 123
                      name: Ada Lovelace
                      email: ada@uni.edu
                    large_course_enrollment: true
                    course_statistics:
                      average_student_attended_percent: 85.4
                      average_student_absence: 2.1
                      first_date_of_attendance: '2025-09-01'
                      last_date_of_attendance: '2025-11-30'
                      average_percent_remote: 10.0
                    settings: null
                    location: null
                    nfc_data: null
                    course_enrollments: null
                  summary: Successful single course creation
                  description: Response body returned when a single course is created
                    successfully.
          description: Created
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
              examples:
                200OK—UpdatedExistingCourse:
                  value:
                    id: 123
                    name: Intro to Algorithms (Updated)
                    code: CSCI-200
                    lms_id: '98765'
                    sis_id: SIS-4455
                    semester: 2025-Fall
                    instructors:
                    - id: 123
                      name: Ada Lovelace
                      email: ada@uni.edu
                    large_course_enrollment: false
                    course_statistics:
                      average_student_attended_percent: 85.4
                      average_student_absence: 2.1
                      first_date_of_attendance: '2025-09-01'
                      last_date_of_attendance: '2025-11-30'
                      average_percent_remote: 10.0
                    settings: null
                    location: null
                    nfc_data: null
                    course_enrollments: null
                  summary: Single course update (idempotent create path)
                  description: Returned when the payload matched an existing course
                    and on_conflict policy led to an update.
          description: OK (existing/updated)
        '207':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseBulkCreateMultiStatusResponse'
              examples:
                207Multi-Status—BulkCreate:
                  value:
                    results:
                    - status: 201
                      id: 201
                    - status: 200
                      id: 202
                      detail: 'Updated existing (conflict policy: update)'
                    - status: 400
                      detail: Multiple courses found with this code; please use a
                        unique identifier
                  summary: Per-item results for bulk create
                  description: Each item includes a numeric status and optional id/detail.
          description: Multi-Status (bulk results)
  /api/dashboard/v1/course-group/:
    get:
      operationId: CourseGroups_List
      description: List all course groups for the **current instance** (resolved from
        the OAuth bearer token). Results are ordered by `id` ascending.
      summary: List course groups
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Course Groups
      security:
      - oauth2:
        - course-group:read
        - course-group:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseGroupList'
          description: Array of course groups for the current instance.
        '401':
          description: Unauthorized (missing/invalid token)
        '403':
          description: Forbidden (scope or license check failed)
        '429':
          description: Too Many Requests (throttled)
    post:
      operationId: CourseGroups_Create
      description: Create one or more course groups for the **current instance** (resolved
        from token). Accepts a single object or an array of objects. **Note:** The
        server sets the `instance` automatically from the token; do not include it
        in the payload.
      summary: Create course groups (single or bulk)
      tags:
      - Course Groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseGroupCreateUpdate'
            examples:
              CreateSingleCourseGroup:
                value:
                  name: Fall 2025 – ENG Groups
                  description: Engineering department groups for Fall 2025 term
                  course_code_pattern: ENG*
                  type: department
                summary: Create single course group
              BulkCreateCourseGroups:
                value:
                - name: Intro – Cohort A
                  description: Freshmen cohort A
                  course_code_pattern: ENG101-*
                  type: cohort
                - name: Intro – Cohort B
                  description: Freshmen cohort B
                  course_code_pattern: ENG101-*
                  type: cohort
                summary: Bulk create course groups
        required: true
      security:
      - oauth2:
        - course-group:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseGroupDetail'
              examples:
                201Created—SingleGroup:
                  value:
                    id: 101
                    name: Fall 2025 – ENG Groups
                    description: Engineering department groups for Fall 2025 term
                    course_code_pattern: ENG*
                    type: department
                    course_count: 0
                  summary: Successful single create returns the created group with
                    id
                  description: When sending a single object, the response contains
                    the created group including its id.
          description: Created group (single create). Returns the created group with
            id and computed fields.
        '207':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseGroupBulkCreateMultiStatusResponse'
              examples:
                207Multi-Status—BulkCreate:
                  value:
                    results:
                    - index: 0
                      status: 201
                      id: 101
                      detail: created
                    - index: 1
                      status: 201
                      id: 102
                      detail: created
                    - index: 2
                      status: 400
                      detail: 'Validation error: name is required'
                  summary: Per-item results for bulk create
                  description: When creating multiple groups, individual items may
                    succeed or fail; this example shows a 207 response body.
          description: 'Multi-Status (bulk). Returned body shape: {"results": [{"index":
            int, "status": int, "id"?: int, "detail"?: str}]}'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (scope or license check failed)
        '429':
          description: Too Many Requests (throttled)
  /api/dashboard/v1/course-group/{course_group_id}/:
    get:
      operationId: CourseGroups_Retrieve
      description: Get details of a specific course group by `course_group_id` for
        the current instance.
      summary: Retrieve a course group
      parameters:
      - in: path
        name: course_group_id
        schema:
          type: integer
        description: ID of the course group.
        required: true
      tags:
      - Course Groups
      security:
      - oauth2:
        - course-group:read
        - course-group:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseGroupDetail'
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (scope or license check failed)
        '404':
          description: Not found (no such group for this instance)
        '429':
          description: Too Many Requests (throttled)
    put:
      operationId: CourseGroups_Update
      description: Full update (PUT) of a course group identified by `course_group_id`.
      summary: Replace a course group
      parameters:
      - in: path
        name: course_group_id
        schema:
          type: integer
        description: ID of the course group.
        required: true
      tags:
      - Course Groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseGroupCreateUpdate'
            examples:
              PUTBody:
                value:
                  name: ENG – Fall 2025 (Updated)
                  description: Updated description
                  course_code_pattern: ENG*
                  type: department
                summary: PUT body
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CourseGroupCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourseGroupCreateUpdate'
        required: true
      security:
      - oauth2:
        - course-group:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseGroupDetail'
          description: Updated group.
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (scope or license check failed)
        '404':
          description: Not found
        '429':
          description: Too Many Requests (throttled)
    patch:
      operationId: CourseGroups_PartialUpdate
      description: Partial update (PATCH) of a course group identified by `course_group_id`.
      summary: Partially update a course group
      parameters:
      - in: path
        name: course_group_id
        schema:
          type: integer
        description: ID of the course group.
        required: true
      tags:
      - Course Groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCourseGroupCreateUpdate'
            examples:
              PATCHBody(renameOnly):
                value:
                  name: ENG – Fall 2025 – Renamed
                summary: PATCH body (rename only)
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCourseGroupCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCourseGroupCreateUpdate'
      security:
      - oauth2:
        - course-group:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseGroupCreateUpdate'
          description: Updated group.
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (scope or license check failed)
        '404':
          description: Not found
        '429':
          description: Too Many Requests (throttled)
    delete:
      operationId: CourseGroups_Delete
      description: Delete the specified course group.
      summary: Delete a course group
      parameters:
      - in: path
        name: course_group_id
        schema:
          type: integer
        description: ID of the course group.
        required: true
      tags:
      - Course Groups
      security:
      - oauth2:
        - course-group:write
      responses:
        '204':
          description: Deleted successfully.
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (scope or license check failed)
        '404':
          description: Not found
        '429':
          description: Too Many Requests (throttled)
  /api/dashboard/v1/course-group/{course_group_id}/courses/:
    get:
      operationId: CourseGroups_Courses_List
      description: List all courses that belong to the specified `course_group_id`
        for the current instance.
      summary: List courses in a course group
      parameters:
      - in: path
        name: course_group_id
        schema:
          type: integer
        description: ID of the course group.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Course Groups
      security:
      - oauth2:
        - course-group:read
        - course-group:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseInGroupList'
          description: Array of courses contained in the group.
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (scope or license check failed)
        '404':
          description: Not found (group not found)
        '429':
          description: Too Many Requests (throttled)
    post:
      operationId: CourseGroups_Courses_Add
      description: Add one or more courses to the specified `course_group_id`. Accepts
        a single object or an array of objects. Exact identifier fields are defined
        by `CourseToGroupSerializer` (e.g., `course_id`).
      summary: Add course(s) to a course group
      parameters:
      - in: path
        name: course_group_id
        schema:
          type: integer
        description: ID of the course group that will receive the course(s).
        required: true
      tags:
      - Course Groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseToGroup'
            examples:
              AddASingleCourseByID:
                value:
                  id_identifier: course_id
                  value: 12345
                summary: Add a single course by ID
              BulkAddCoursesByID:
                value:
                - id_identifier: course_id
                  value: 12345
                - id_identifier: course_code
                  value: CS-101
                - id_identifier: course_name
                  value: Intro to CS
                summary: Bulk add courses by ID
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CourseToGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourseToGroup'
        required: true
      security:
      - oauth2:
        - course-group:write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseInGroupList'
              examples:
                201Created—BulkAddResponse:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - - id: 12345
                        name: Intro to CS
                        courseId: CRS-12345
                        code: CS-101
                      - id: 12346
                        name: Intro to CS
                        courseId: CRS-12346
                        code: CS-102
                  summary: Successful bulk add returns the added courses
                  description: When sending an array, the response is an array of
                    the added courses in base shape.
          description: Added course(s). **If a single object was sent, response will
            still be an array of length 1.**
        '400':
          description: Validation error (e.g., unknown course id)
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (scope or license check failed)
        '404':
          description: Not found (group not found)
        '429':
          description: Too Many Requests (throttled)
  /api/dashboard/v1/course-group/{course_group_id}/courses/{course_identifier}/:
    get:
      operationId: CourseGroups_Courses_Retrieve
      description: Retrieve details for a specific course that is a member of the
        given `course_group_id`. `course_identifier` supports the identifier formats
        your API accepts (e.g., numeric course ID). If the course is not a member
        of the group, a 404 is returned.
      summary: Retrieve a specific course in a course group
      parameters:
      - in: path
        name: course_group_id
        schema:
          type: integer
        description: ID of the course group.
        required: true
      - in: path
        name: course_identifier
        schema:
          type: string
        description: Accepts non-primary identifier like, course_code:{code}, course_id:{id},
          course_name:{name}.
        required: true
        examples:
          GetCourseByInternalID(pk):
            value: course_id:1111
            summary: Get course by internal ID(pk)
            description: Get course by internal course id
          GetCourseByCourseCode:
            value: course_code:CS-101
            summary: Get course by course code
            description: Get course by course code
          GetCourseByCourseName:
            value: course_name:Intro to CS
            summary: Get course by course name
            description: Get course by course name
      tags:
      - Course Groups
      security:
      - oauth2:
        - course-group:read
        - course-group:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseInGroup'
          description: ''
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (scope or license check failed)
        '404':
          description: Not found (course not in this group / not resolvable)
        '429':
          description: Too Many Requests (throttled)
    delete:
      operationId: CourseGroups_Courses_Delete
      description: Remove (idempotently) a specific course from the given `course_group_id`.
        If the course is not a member, the operation is treated idempotently.
      summary: Remove a course from a course group
      parameters:
      - in: path
        name: course_group_id
        schema:
          type: integer
        description: ID of the course group.
        required: true
      - in: path
        name: course_identifier
        schema:
          type: string
        description: Accepts non-primary identifier like, course_code:{code}, course_id:{id},
          course_name:{name}.
        required: true
        examples:
          DeleteCourseByInternalID(pk):
            value: course_id:1111
            summary: Delete course by internal ID(pk)
            description: Get course by internal course id
          DeleteCourseByCourseCode:
            value: course_code:CS-101
            summary: Delete course by course code
            description: Get course by course code
          DeleteCourseByCourseName:
            value: course_name:Intro to CS
            summary: Delete course by course name
            description: Get course by course name
      tags:
      - Course Groups
      security:
      - oauth2:
        - course-group:write
      responses:
        '204':
          description: Removed successfully (idempotent).
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (scope or license check failed)
        '404':
          description: Not found (group or course not resolvable)
        '429':
          description: Too Many Requests (throttled)
  /api/dashboard/v1/course/{course_identifier}/:
    get:
      operationId: Course_Detail_GET
      description: 'GET a single course by identifier. Identifier syntax: id:{pk}
        | lms_id:{value} | sis_id:{value} | code:{value} or simply {pk} (defaults
        to id)'
      summary: Get course detail
      parameters:
      - in: path
        name: course_identifier
        schema:
          type: string
        description: 'One of: id:{pk} | lms_id:{value} | sis_id:{value} | code:{value}'
        required: true
      - in: query
        name: include[]
        schema:
          type: array
          items:
            type: string
        description: 'Repeated. Allowed: course_statistics, settings, location, nfc_data,
          course_enrollments, absence_limits. Note: location and nfc_data are legacy;
          rooms should be used instead. Note: course_enrollments requires the user:read
          or user:write scope.'
      tags:
      - Course
      security:
      - oauth2:
        - course:read
        - course:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: Course detail
    put:
      operationId: Course_Update
      description: |-
        Replace all course fields using the request body shape below.

        Semester field: On input (PUT), the "semester" field accepts either the semester NAME or the semester CODE. Responses will always return the semester NAME.

        Note: course_enrollments is read-only and cannot be created or edited via this API. Requests including course_enrollments will be rejected with a 400 error.
      summary: Full update course
      parameters:
      - in: path
        name: course_identifier
        schema:
          type: string
        required: true
      tags:
      - Course
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpdateRequest'
            examples:
              FullUpdateExample:
                value:
                  name: Intro to Algorithms
                  code: CSCI-200
                  lms_id: '98765'
                  sis_id: SIS-4455
                  semester: 2025-Fall
                  instructors:
                  - user_identifier: id
                    value: '123'
                  room_ids:
                  - 1
                  - 2
                  large_course_enrollment: true
                  settings:
                    student_grouping: single
                    grading:
                      session_based_grading:
                        grading_method: points_per_session
                        column_name: Attendance
                        points: 1
                      absence_based_grading:
                        column_name: Absences
                        total_points: 20
                        points_per_absence: -1
                        forgive_absences: 2
                        forgive_absences_method: exclude
