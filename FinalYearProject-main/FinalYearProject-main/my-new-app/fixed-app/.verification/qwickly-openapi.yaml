        schema:
          type: string
        required: true
      tags:
      - Course
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCourseUpdateRequest'
            examples:
              PartialUpdate:AbsenceLimitsOnly:
                value:
                  settings:
                    absence_limits:
                    - limit: 1
                      label: Caution
                      email_template: Hi {-first-} {-last-}, you've reached {-limit-1-}.
                    - limit: 2
                      label: Maximum
                      email_template: Hi {-first-} {-last-}, you've reached {-limit-2-}.
                    - limit: 3
                      label: Surpassed
                      email_template: Hi {-first-} {-last-}, you've reached {-limit-3-}.
                summary: 'Partial update: absence_limits only'
                description: Patch only the absence limits (values, labels, and email
                  templates).
              PartialUpdate:Comprehensive:
                value:
                  name: Intro to Algorithms (Honors)
                  code: CSCI-200H
                  sis_id: SIS-4455-H
                  semester: 2025-Fall
                  instructors:
                  - user_identifier: id
                    value: '123'
                  - user_identifier: id
                    value: '124'
                  large_course_enrollment: false
                  settings:
                    student_grouping: single
                    grading:
                      session_based_grading:
                        grading_method: total_points
                        column_name: Attendance
                        points: 100
                      absence_based_grading:
                        column_name: Absences
                        total_points: 20
                        points_per_absence: -1
                        forgive_absences: 2
                        forgive_absences_method: exclude
                    check_in:
                      check_in_pin_requirement: false
                      check_in_qr_mode: true
                      check_in_timer: 60
                    absence_limits:
                    - limit: 1
                      label: Caution
                      email_template: Template 1
                    - limit: 2
                      label: Maximum
                      email_template: Template 2
                    - limit: 3
                      label: Surpassed
                      email_template: Template 3
                    enable_location_confirmation_course: true
                    enable_nfc_tag_confirmation_course: false
                  location:
                    room_name: ET 202
                    latitude: 39.77
                    longitude: -86.16
                    radius: 30
                  nfc_data:
                    nfc: updated-tag
                summary: 'Partial update: comprehensive'
                description: Patch a mix of base fields and nested sections including
                  settings, location, and NFC.
      security:
      - oauth2:
        - course:write
